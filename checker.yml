name: Test Login Only

on:
  workflow_dispatch:

jobs:
  test-login:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 curl_cffi

      - name: Run Login Test
        env:
          EMPORIO_EMAIL: ${{ secrets.EMPORIO_EMAIL }}
          EMPORIO_PASSWORD: ${{ secrets.EMPORIO_PASSWORD }}
        run: python main.py
